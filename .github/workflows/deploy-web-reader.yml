name: Deploy web reader

on:
  push:
    branches:
      - master
    paths:
      - "Am_I_The_Bad_Guy_Master_Draft.md"
      - "web-reader/**"
      - ".github/workflows/deploy-web-reader.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web-reader
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-reader/package-lock.json

      - name: Install and build
        working-directory: web-reader
        run: npm ci && npm run build

      - name: Deploy to gh-pages
        working-directory: web-reader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx gh-pages -d dist -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
